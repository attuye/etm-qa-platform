appId: com.etm.partnershop
name: Wrong password shows an error and stays on the login screen
tags:
  - smoke
  - auth
---
- runFlow: ../subflows/register-customer.yaml
- launchApp:
    clearState: true
- runFlow:
    file: ../subflows/log-in.yaml
    env:
      EMAIL: ${output.customer.email}
      PASSWORD: "Wrong-Passw0rd!"
- assertVisible:
    id: "login-error"
- assertVisible: "Invalid email or password"
- assertNotVisible: "My orders"