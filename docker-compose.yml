services:
  postgres:
    image: postgres:17
    container_name: etm-postgres
    environment:
      POSTGRES_USER: etm
      POSTGRES_PASSWORD: etm_dev_password
      POSTGRES_DB: etm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etm -d etm"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: