name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NO_COLOR: 1
  NEXT_TELEMETRY_DISABLED: 1
  PORT: 3001
  DATABASE_URL: postgres://etm:etm_ci_password@localhost:5432/etm
  DB_SYNC: 'true'
  JWT_SECRET: ci-only-secret-not-used-anywhere-else
  JWT_EXPIRES_IN_SECONDS: 3600
  ADMIN_EMAIL: admin@example.com
  ADMIN_PASSWORD: Admin123!Ci
  TEST_ENV: ci
  API_BASE_URL: http://localhost:3001/api
  WEB_BASE_URL: http://localhost:3000

jobs:
  api-tests:
    name: Build, typecheck and API tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: etm
          POSTGRES_PASSWORD: etm_ci_password
          POSTGRES_DB: etm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U etm -d etm"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build packages and apps
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Start the API
        run: npm run start -w @etm/api > api.log 2>&1 &

      - name: Wait for the API to be healthy
        run: |
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:3001/api/health > /dev/null; then
              echo "API is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in 60 seconds"
          cat api.log
          exit 1

      - name: Run API tests
        run: npm run test:api -- --ci

      - name: Upload API log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-log
          path: api.log
          retention-days: 7