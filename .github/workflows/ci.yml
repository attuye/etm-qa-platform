name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NO_COLOR: 1
  NEXT_TELEMETRY_DISABLED: 1
  PORT: 3001
  DATABASE_URL: postgres://etm:etm_ci_password@localhost:5432/etm
  DB_SYNC: 'true'
  JWT_SECRET: ci-only-secret-not-used-anywhere-else
  JWT_EXPIRES_IN_SECONDS: 3600
  ADMIN_EMAIL: admin@example.com
  ADMIN_PASSWORD: Admin123!Ci
  TEST_ENV: ci
  API_BASE_URL: http://localhost:3001/api
  WEB_BASE_URL: http://localhost:3000

jobs:
  api-tests:
    name: Build, typecheck and API tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      PUBSUB_ENABLED: 'true'
      PUBSUB_PROJECT_ID: etm-local
      PUBSUB_EMULATOR_HOST: localhost:8085
      METADATA_SERVER_DETECTION: none
      EVENTS_ENABLED: 'true'
      
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: etm
          POSTGRES_PASSWORD: etm_ci_password
          POSTGRES_DB: etm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U etm -d etm"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out the code
        uses: actions/checkout@v4
      
      - name: Start Pub/Sub emulator
        run: |
          docker run -d --name pubsub -p 8085:8085 \
            gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators \
            gcloud beta emulators pubsub start --host-port=0.0.0.0:8085 --project=etm-local
          timeout 90 bash -c 'until curl -sf http://localhost:8085 > /dev/null; do sleep 2; done'
          echo "Pub/Sub emulator is ready"
      - name: Start platform
        uses: ./.github/actions/start-platform

      - name: Typecheck
        run: npm run typecheck

      - name: Run API tests
        run: npm run test:api -w @etm/orders-team -- --ci

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: k6 smoke test
        run: k6 run -e PROFILE=smoke suites/orders-team/perf/orders-load.js

      - name: Upload API log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-tests-logs
          path: api.log
          retention-days: 7
      - name: Pub/Sub emulator log
        if: failure()
        run: docker logs pubsub

  e2e-tests:
    name: E2E tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: etm
          POSTGRES_PASSWORD: etm_ci_password
          POSTGRES_DB: etm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U etm -d etm"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Start platform
        uses: ./.github/actions/start-platform

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start the web app
        run: npm run start -w @etm/web > web.log 2>&1 &

      - name: Wait for the web app
        run: bash tools/ci/wait-for.sh http://localhost:3000/login "Web app" web.log

      - name: Run E2E tests
        run: npm run test:e2e -w @etm/orders-team

      - name: Summarise E2E results
        if: ${{ !cancelled() }}
        run: node tools/ci/playwright-summary.mjs suites/orders-team/reports/e2e-results.json

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            suites/orders-team/playwright-report
            suites/orders-team/test-results
          retention-days: 7

      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-server-logs
          path: |
            api.log
            web.log
          retention-days: 7